[project]
name = "flore"
version = "0.1.0"
description = "FLoRe: Learning Force-Reactive Humanoid Loco-Manipulation (force-reactive diffusion policy)"
readme = "README.md"
# 3.12+ : the action-layout registry's frozen dataclasses hold `slice` fields, and
# `slice` only became hashable in 3.12. The repo's venv is 3.13; declaring 3.10 promised
# a portability the code does not have (a hash of a KeypointSlots would pass CI here and
# raise TypeError on a supported interpreter).
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "timm>=1.0",
    # DDIM/DDPM scheduler (flore/s1_policy/model/diffusion_base.py) + the trainer's EMA.
    "diffusers>=0.39",
    "einops",
    "numpy",
    "scipy",
    "websockets>=12",
    "zarr>=2.16,<3",
    # zarr 2.x imports numcodecs' `cbuffer_sizes`, removed in numcodecs 0.16 —
    # 0.16.x breaks `import zarr` outright. Pin below 0.16 until zarr 3.
    "numcodecs<0.16",
    "imagecodecs",
    "opencv-python-headless",
    "Pillow",
    "tyro",
    "wandb",
    "safetensors",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
realsense = [
    "pyrealsense2",
]
# Browser (viser) inference-visualization tools: the offline viewers (scripts/infer_s1_*.py)
# and the planner pages. Purely additive to the training .venv — these pins match
# UMI_collection's viz venv (env/requirements-venv.txt) and resolve with NO change to any
# training dep (torch/zarr/numpy/etc. versions are untouched). The G1 mink IK stack itself is
# vendored on PYTHONPATH from third_party/UMI_collection (NOT pip-installed here).
# Install with:  uv pip install --python .venv/bin/python -e ".[viz]"
viz = [
    "viser==1.0.30",
    "mink==1.1.1",
    "mujoco==3.9.0",
    "yourdfpy==0.0.60",
    "daqp==0.8.7",
    "qpsolvers==4.12.0",
    "matplotlib==3.11.2",   # scripts/plot_rollout_record.py (the ⏺ run recorder's plots)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flore"]

[tool.ruff]
line-length = 120
target-version = "py310"
force-exclude = true

[tool.pytest.ini_options]
testpaths = ["tests"]
