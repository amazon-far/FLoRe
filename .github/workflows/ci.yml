name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify locked environment plan
        run: |
          uv lock --check
          uv sync --locked --extra dev --dry-run

      - name: Build wheel
        run: uv build --wheel

      - name: Install wheel and test tools
        run: |
          uv venv --python python .venv
          uv pip install --python .venv/bin/python --torch-backend cpu \
            dist/*.whl "pytest==9.1.1" "ruff==0.15.22"

      - name: Verify installed wheel imports
        working-directory: ${{ runner.temp }}
        run: |
          FLORE_PACKAGE="$("$GITHUB_WORKSPACE/.venv/bin/python" -I -c \
            'import pathlib, flore; print(pathlib.Path(flore.__file__).resolve().parent)')"
          chmod -R a-w "$FLORE_PACKAGE"
          PYTHONDONTWRITEBYTECODE=1 "$GITHUB_WORKSPACE/.venv/bin/python" -I - <<'PY'
          import os
          from pathlib import Path

          import flore
          import zarr
          from flore.s1_policy.data.hl_dataset import HLDataset

          source_package = (Path(os.environ["GITHUB_WORKSPACE"]) / "flore").resolve()
          installed_package = Path(flore.__file__).resolve().parent
          assert installed_package != source_package
          assert HLDataset is not None
          PY

      - name: CLI smoke tests
        run: |
          git ls-files --error-unmatch \
            flore/s1_policy/data/__init__.py \
            flore/s1_policy/data/norm_stats.py \
            flore/s1_policy/data/transforms.py \
            flore/s1_policy/data/hl_dataset.py
          .venv/bin/python scripts/train_s1.py --help >/dev/null
          bash scripts/collect_data.sh --mock --help >/dev/null

      - name: Ruff
        run: git ls-files -z -- '*.py' | xargs -0 -r .venv/bin/ruff check

      - name: Root pytest suite
        run: .venv/bin/python -m pytest -ra

      - name: Shell syntax
        run: git ls-files -z -- '*.sh' | xargs -0 -r -n 1 bash -n
